name: Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug = Pixeldrain only, test = + GitHub release, release = + OTA XML)'
        type: choice
        options:
          - debug
          - test
          - release
        default: debug
  pull_request:
  push:
    branches:
      - 'sixteen-qpr2'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [z3q]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
            build-essential g++-aarch64-linux-gnu gcc-aarch64-linux-gnu python-is-python3 python3 wget
          wget https://raw.githubusercontent.com/kdrag0n/kramflash/refs/heads/master/mkbootimg.py && sudo ln -sf $(pwd)/mkbootimg.py /usr/bin/mkbootimg && chmod +x /usr/bin/mkbootimg
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/artisanrom_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/artisanrom_platform.x509.pem
          echo -n "${{ secrets.OTA_KEY_PK8 }}" | base64 --decode > security/artisanrom_ota.pk8
          echo -n "${{ secrets.OTA_KEY_PEM }}" | base64 --decode > security/artisanrom_ota.x509.pem

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build dependencies
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: source ./buildenv.sh ${{ matrix.target }} && ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh

      - name: Add swapspace
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 12

      - name: Build ROM
        run: |
          set -o pipefail
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh 2>&1 | tee build.log

      - name: Collect failed patch info
        if: failure()
        run: |
          OUT="patch-fail/${{ matrix.target }}"
          mkdir -p "$OUT"
          [ -f build.log ] || { echo "no build.log"; exit 0; }
          sed 's/\x1b\[[0-9;]*m//g' build.log > "$OUT/build.log"
          LOG="$OUT/build.log"
          echo "## ❌ Build failure (${{ matrix.target }})" >> "$GITHUB_STEP_SUMMARY"
          FOUND=0

          # ---------- 1) git apply (smali / text) failures ----------
          grep -oP 'git apply --directory="\K[^"]+(?=".*"[^"]+\.patch")|"\K[^"]+\.patch(?="\s*$)' "$LOG" \
            | paste - - | sort -u > "$OUT/failed_patches.tsv" || true
          n=0
          while IFS=$'\t' read -r DIR PATCH; do
            [ -n "$PATCH" ] || continue
            FOUND=1; n=$((n+1))
            CASE="$OUT/git_apply_$n"
            mkdir -p "$CASE/orig" "$CASE/rej"
            cp "$PATCH" "$CASE/"
            echo "$DIR" > "$CASE/target_dir.txt"
            grep -oP '^diff --git a/\K\S+' "$PATCH" | while read -r f; do
              if [ -f "$DIR/$f" ]; then
                install -D "$DIR/$f" "$CASE/orig/$f"
              else
                # Class may have moved to another smali_classesN dir
                ALT="$(find "$DIR" -type f -path "*/smali*/${f#smali*/}" 2>/dev/null | head -1)"
                if [ -n "$ALT" ]; then
                  install -D "$ALT" "$CASE/moved/${ALT#$DIR/}"
                  echo "MOVED: $f -> ${ALT#$DIR/}" >> "$CASE/missing.txt"
                else
                  echo "MISSING: $f" >> "$CASE/missing.txt"
                fi
              fi
            done
            # Related classes: everything the patch and the touched files reference
            # that lives in this APK/JAR (helps rebuilding the patch for new code)
            { grep -ohP 'L\K[A-Za-z0-9_/$]+(?=;)' "$PATCH"
              [ -d "$CASE/orig" ] && grep -rohP 'L\K[A-Za-z0-9_/$]+(?=;)' "$CASE/orig"
              [ -d "$CASE/moved" ] && grep -rohP 'L\K[A-Za-z0-9_/$]+(?=;)' "$CASE/moved"
            } 2>/dev/null | grep -vE '^(java|javax|android|androidx|kotlin|dalvik)/' | sort -u | head -400 \
              | while read -r cls; do
                  for c in "$DIR"/smali*/"$cls".smali; do
                    if [ -f "$c" ]; then install -D "$c" "$CASE/related/${c#$DIR/}"; fi
                  done
                done || true
            cp -a "$CASE/orig/." "$CASE/rej/"
            LC_ALL=C git apply --directory="$PWD/$CASE/rej" --unsafe-paths --reject --verbose \
              "$PATCH" > "$CASE/reject.log" 2>&1 || true
            find "$CASE/rej" -type f ! -name '*.rej' -delete
            {
              echo "### git apply: $(basename "$PATCH")"
              echo "- target: \`${DIR#$GITHUB_WORKSPACE/}\`"
              echo '```'
              grep -E 'Rejected hunk|Applying patch|does not apply|patch failed|Reversed' "$CASE/reject.log" \
                | sed "s#$PWD/$CASE/rej/##" || true
              [ -f "$CASE/missing.txt" ] && cat "$CASE/missing.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done < "$OUT/failed_patches.tsv"

          # ---------- 2) HEX_PATCH failures (binary .so / bin) ----------
          grep -oP '\(\K[^:()]+:[0-9]+(?=:HEX_PATCH\) No ")|HEX_PATCH\) No "\K[0-9a-fA-F]+(?=" match in )|" match in \K\S+' "$LOG" \
            | paste - - - > "$OUT/failed_hex.tsv" || true
          n=0
          while IFS=$'\t' read -r SRC HEX BIN; do
            [ -n "$BIN" ] || continue
            FOUND=1; n=$((n+1))
            CASE="$OUT/hex_patch_$n"
            mkdir -p "$CASE"
            SCRIPT="${SRC%%:*}"; LINE="${SRC##*:}"
            # Log paths may be relative to $WORK_DIR (e.g. /system/system/lib/x.so)
            if [ ! -f "$BIN" ]; then
              BIN="$(find out -type f -path "*${BIN}" 2>/dev/null | head -1)"
            fi
            [ -f "$BIN" ] && cp "$BIN" "$CASE/"
            # The HEX_PATCH call itself (shows the replacement bytes)
            [ -f "$SCRIPT" ] && awk -v l="$LINE" 'NR>=l-6 && NR<=l+3 {printf "%s%5d  %s\n", (NR==l?">>":"  "), NR, $0}' "$SCRIPT" > "$CASE/call_site.txt"
            [ -f "$BIN" ] && python3 - "$BIN" "$HEX" > "$CASE/candidates.txt" 2>&1 <<'PY' || true
          import sys, subprocess, shutil
          path, pat = sys.argv[1], bytes.fromhex(sys.argv[2])
          data = open(path, 'rb').read()
          mc = shutil.which('llvm-mc') or shutil.which('llvm-mc-18')
          def dis(b, base):
              if not mc or len(b) % 4:
                  return b.hex()
              words = [b[i:i+4] for i in range(0, len(b), 4)]
              r = subprocess.run([mc, '--disassemble', '--show-encoding', '-triple=aarch64'],
                                 input='\n'.join(' '.join(f'0x{x:02x}' for x in w) for w in words),
                                 capture_output=True, text=True)
              got = []
              for l in r.stdout.splitlines():
                  if '// encoding:' in l:
                      t, e = l.split('// encoding:')
                      got.append((bytes(int(x, 16) for x in e.strip(' []').split(',')), t.strip()))
              out, j = [], 0
              for i, w in enumerate(words):
                  t = '<invalid>'
                  if j < len(got) and got[j][0] == w:
                      t = got[j][1]; j += 1
                  out.append(f'    {base+4*i:#010x}: {w.hex()}  {t}')
              return '\n'.join(out)
          print(f'pattern {pat.hex()} ({len(pat)} bytes), file {len(data)} bytes')
          print(dis(pat, 0)); print()
          if pat in data:
              print('EXACT MATCH at', hex(data.index(pat))); sys.exit()
          L = len(pat); step = 4 if L % 4 == 0 else 1
          pc = [bin(i).count('1') for i in range(256)]
          best = []
          for off in range(0, len(data) - L + 1, step):
              d = 0
              for a, b in zip(data[off:off+L], pat):
                  d += pc[a ^ b]
                  if d > L * 2: break
              else:
                  best.append((d, off))
          best.sort()
          print(f'closest {min(len(best),15)} locations by bit distance (lower = closer):')
          for d, off in best[:15]:
              ctx = max(0, off - 16) & ~3
              print(f'\n== offset {off:#x}  bit-diff {d}  bytes {data[off:off+L].hex()}')
              print(dis(data[ctx:off + L + 16], ctx))
          PY
            {
              echo "### HEX_PATCH: $(basename "$BIN")"
              echo "- called from \`${SCRIPT#$GITHUB_WORKSPACE/}:$LINE\`, pattern \`$HEX\`"
              echo '```'
              [ -f "$CASE/call_site.txt" ] && cat "$CASE/call_site.txt"
              echo
              [ -f "$CASE/candidates.txt" ] && head -40 "$CASE/candidates.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done < "$OUT/failed_hex.tsv"

          # ---------- 3) SMALI_PATCH failures ----------
          grep -oP '\(\K[^:()]+:[0-9]+(?=:SMALI_PATCH\) Failed)|SMALI_PATCH\) Failed.* in \K\S+\.smali' "$LOG" \
            | paste - - > "$OUT/failed_smali.tsv" || true
          n=0
          while IFS=$'\t' read -r SRC SMALI; do
            [ -n "$SMALI" ] || continue
            FOUND=1; n=$((n+1))
            CASE="$OUT/smali_patch_$n"
            mkdir -p "$CASE"
            SCRIPT="${SRC%%:*}"; LINE="${SRC##*:}"
            F="$SMALI"
            [ -f "$F" ] || F="$(find out -type f -path "*${SMALI}" 2>/dev/null | head -1)"
            [ -f "$F" ] || F="$(find out -type f -path "*${SMALI#/system}" 2