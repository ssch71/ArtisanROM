name: Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug = Pixeldrain only, test = + GitHub release, release = + OTA XML)'
        type: choice
        options:
          - debug
          - test
          - release
        default: debug
  pull_request:
  push:
    branches:
      - 'sixteen-qpr2'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [y2q,z3q]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
            build-essential g++-aarch64-linux-gnu gcc-aarch64-linux-gnu patchelf python-is-python3 python3 wget
          wget https://raw.githubusercontent.com/kdrag0n/kramflash/refs/heads/master/mkbootimg.py && sudo ln -sf $(pwd)/mkbootimg.py /usr/bin/mkbootimg && chmod +x /usr/bin/mkbootimg
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/artisanrom_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/artisanrom_platform.x509.pem
          echo -n "${{ secrets.OTA_KEY_PK8 }}" | base64 --decode > security/artisanrom_ota.pk8
          echo -n "${{ secrets.OTA_KEY_PEM }}" | base64 --decode > security/artisanrom_ota.x509.pem

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build dependencies
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: source ./buildenv.sh ${{ matrix.target }} && ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh

      - name: Add swapspace
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 12

      - name: Build ROM
        run: |
          set -o pipefail
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh 2>&1 | tee build.log

      - name: Check SELinux policy (same compile as init)
        if: always()
        run: |
          W="out/target/${{ matrix.target }}/work_dir"
          [ -d "$W" ] || { echo "no work_dir"; exit 0; }
          sudo apt-get install -yq flex bison > /dev/null
          git clone -q --depth 1 -b 3.8.1 https://github.com/SELinuxProject/selinux /tmp/selinux
          make -s -C /tmp/selinux/libsepol -j"$(nproc)" > /dev/null
          make -s -C /tmp/selinux/libsepol install DESTDIR=/tmp/sepolroot > /dev/null
          make -s -C /tmp/selinux/secilc secilc CFLAGS="-O2 -I/tmp/sepolroot/usr/include" LDFLAGS="-L/tmp/sepolroot/usr/lib" > /dev/null
          export LD_LIBRARY_PATH=/tmp/sepolroot/lib:/tmp/sepolroot/usr/lib
          SECILC=/tmp/selinux/secilc/secilc
          SYS="$W/system/system/etc/selinux"
          SE="$W/system/system/system_ext/etc/selinux"; [ -d "$W/system_ext/etc/selinux" ] && SE="$W/system_ext/etc/selinux"
          PR="$W/product/etc/selinux"; VE="$W/vendor/etc/selinux"; OD="$W/odm/etc/selinux"
          VER="$(cat "$VE/plat_sepolicy_vers.txt")"
          echo "vendor sepolicy version: $VER"
          echo "system mappings: $(ls "$SYS/mapping" | tr '\n' ' ')"
          ARGS=("$SYS/plat_sepolicy.cil" "$SYS/mapping/$VER.cil")
          [ -f "$SYS/mapping/$VER.compat.cil" ] && ARGS+=("$SYS/mapping/$VER.compat.cil")
          for d in "$SE" "$PR"; do
            for f in "$d"/*_sepolicy.cil "$d/mapping/$VER.cil"; do [ -f "$f" ] && ARGS+=("$f"); done
          done
          for f in "$VE/plat_pub_versioned.cil" "$VE/vendor_sepolicy.cil" "$OD/odm_sepolicy.cil"; do
            [ -f "$f" ] && ARGS+=("$f")
          done
          printf '  %s\n' "${ARGS[@]#$W/}"
          if "$SECILC" -m -M true -G -N -c 30 "${ARGS[@]}" -o /tmp/policy -f /dev/null; then
            echo "::notice::SELinux policy compiles OK"
          else
            echo "::error::SELinux policy compile FAILED (this is what kills init)"
          fi

      - name: Collect failed patch info
        if: failure()
        env:
          # collect_patch_fail.sh + hex_candidates.py (tar.gz, base64)
          CI_TOOLS: ""
        run: |
          mkdir -p /tmp/ci && echo "$CI_TOOLS" | base64 -d | tar xzf - -C /tmp/ci
          bash /tmp/ci/collect_patch_fail.sh "${{ matrix.target }}"

      - name: Upload failed patch info
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: patch-fail-${{ matrix.target }}
          path: patch-fail/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload to GoFile
        id: gofile
        continue-on-error: true
        timeout-minutes: 40
        run: |
          ZIP_FILE=$(find out -maxdepth 1 -type f -name "*sign.zip" | head -n 1)
          [ -n "$ZIP_FILE" ] || { echo "::error::No signed zip found"; exit 1; }
          echo "Uploading $ZIP_FILE ($(du -h "$ZIP_FILE" | cut -f1))"
          for SERVER in upload upload-eu-par upload-na-phx upload-ap-sgp; do
            for TRY in 1 2; do
              echo "- $SERVER.gofile.io (try $TRY)"
              RESPONSE=$(curl -sS --connect-timeout 30 --max-time 1500 --retry 2 --retry-delay 10 \
                -F "file=@$ZIP_FILE" -F "token=${{ secrets.GOFILE_TOKEN }}" -F "folderId=${{ secrets.GOFILE_FOLDER }}" \
                "https://$SERVER.gofile.io/uploadFile" || true)
              LINK=$(echo "$RESPONSE" | jq -r '.data.downloadPage // empty' 2>/dev/null || true)
              if [ -n "$LINK" ]; then
                echo "Download link: $LINK"
                echo "### ${{ matrix.target }}: $LINK" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "  failed: ${RESPONSE:0:200}"
            done
          done
          echo "::warning::GoFile upload failed on all servers, falling back to workflow artifact"
          exit 1

      - name: Upload ROM as artifact (GoFile fallback)
        if: steps.gofile.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rom-${{ matrix.target }}
          path: out/*sign.zip
          compression-level: 0
          retention-days: 3
